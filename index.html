<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kisaan Sales Dashboard</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231f7a5a'/%3E%3Cpath d='M7 22V14M13 22V9M19 22v-6M25 22V11' stroke='white' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div id="splash"><div class="spinner"></div><p>Loading dashboard…</p></div>
<div id="app">
  <aside class="side">
    <div class="brand"><div class="logo"><svg viewBox="0 0 32 32" width="26" height="26"><path d="M7 22V14M13 22V9M19 22v-6M25 22V11" stroke="#fff" stroke-width="3" stroke-linecap="round" fill="none"/></svg></div><div><b>Kisaan</b><span>Sales dashboard</span></div></div>
    <nav id="nav"></nav>
    <div class="sidefoot">Data is pasted into the Google Sheet daily; this page reads it automatically.</div>
  </aside>
  <main>
    <header class="top">
      <div id="status" class="status"></div>
      <div class="actions"><button id="refresh" class="icon" title="Refresh data from Google Sheet" aria-label="Refresh"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 11-3-6.7L21 8M21 3v5h-5"/></svg></button>
      <button id="theme" class="icon" title="Light / dark" aria-label="Theme"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 13A9 9 0 1111 3a7 7 0 0010 10z"/></svg></button></div>
    </header>
    <section id="filters" class="filters"></section>
    <div id="page"></div>
  </main>
</div>
<div id="tip"></div><div id="drawer"></div>
<script src="js/config.js"></script><script src="js/util.js"></script><script src="js/store.js"></script><script src="js/filters.js"></script>
<script src="js/charts.js"></script><script src="js/ui.js"></script><script src="js/app.js"></script>
</body>
</html>
