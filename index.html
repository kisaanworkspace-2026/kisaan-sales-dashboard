<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kisaan Sales Dashboard</title>
<link rel="icon" type="image/png" href="assets/icon-192.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#14391f">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div id="splash"><div class="spinner"></div><p>Loading dashboard…</p></div>
<div id="sback" class="sback"></div>
<div id="app">
  <aside class="side">
    <div class="brand"><div class="logo"><img src="assets/icon-192.png" alt="Kisaan"></div><div class="btxt"><b>Kisaan</b><span>Sales dashboard</span></div><button id="railbtn" class="railbtn" type="button" aria-label="Collapse sidebar" title="Collapse sidebar"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg></button></div>
    <nav id="nav"></nav>
    <div class="sidefoot">Data is pasted into the Google Sheet daily; this page reads it automatically.</div>
  </aside>
  <main>
    <header class="top">
      <button id="menubtn" class="icon menubtn" type="button" aria-label="Menu" title="Menu"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
      <div id="status" class="status"></div>
      <div id="rbox" class="rbox" hidden role="status" aria-live="polite"><span id="rlabel"></span><span class="rbar" id="rbarw"><i id="rbar"></i></span><b id="rpct"></b><a href="#" id="rretry" hidden>Retry</a><button type="button" id="rclose" class="rx" aria-label="Dismiss" hidden>✕</button></div>
      <div class="actions"><button id="refresh" class="icon" title="Refresh data from Google Sheet" aria-label="Refresh"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 11-3-6.7L21 8M21 3v5h-5"/></svg></button>
      <button id="print" class="icon" title="Print / save as PDF" aria-label="Print"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9V3h12v6M6 18H4v-7h16v7h-2M7 14h10v7H7z"/></svg></button>
      <button id="theme" class="icon" title="Light / dark" aria-label="Theme"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 13A9 9 0 1111 3a7 7 0 0010 10z"/></svg></button></div>
    </header>
    <section id="filters" class="filters"></section>
    <div id="page"></div>
  </main>
</div>
<div id="tip"></div><div id="drawer"></div>
<script src="js/config.js"></script><script src="js/util.js"></script><script src="js/decode.js"></script><script src="js/store.js"></script><script src="js/filters.js"></script>
<script src="js/charts.js"></script><script src="js/help.js"></script><script src="js/ui.js"></script><script src="js/app.js"></script>
</body>
</html>
